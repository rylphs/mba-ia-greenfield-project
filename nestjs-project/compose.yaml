services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7.4-alpine
    # BullMQ requires noeviction (evicted keys corrupt queue state); AOF keeps jobs across restarts
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Community MinIO builds are no longer published on Docker Hub/quay.io; Chainguard's
  # rebuild is pinned by digest (-dev variant ships wget for the healthcheck)
  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:d7c906993247627c19f37fc1fa302c34cf2d209ae0e7dc7d52fb0be6ac2849ba
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
      - MINIO_API_STALE_UPLOADS_EXPIRY=24h
      # Community MinIO has no per-bucket CORS API; allowed origins are server-wide.
      # ETag is part of MinIO's default exposed headers (browser multipart needs it).
      - MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:3001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MC_CONFIG_DIR=/tmp/.mc
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_VIDEOS_BUCKET=${S3_VIDEOS_BUCKET}
      - S3_THUMBNAILS_BUCKET=${S3_THUMBNAILS_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_VIDEOS_BUCKET" "local/$$S3_THUMBNAILS_BUCKET"
        # GetObject only: the canned `download` policy also grants ListBucket, which
        # would let anyone enumerate every videoId (drafts included) via the thumbnail keys
        cat > /tmp/thumbnails-policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$$S3_THUMBNAILS_BUCKET/*"]}]}
        EOF
        mc anonymous set-json /tmp/thumbnails-policy.json "local/$$S3_THUMBNAILS_BUCKET"

volumes:
  redis-data:
  minio-data:


